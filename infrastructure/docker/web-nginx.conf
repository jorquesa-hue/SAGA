# nginx config for the SAGA web console container.
# Serves the Vite SPA and proxies /api to the API service (same-origin).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: unknown client-side routes resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API proxy — keeps the browser same-origin, so no CORS is required in the
  # composed stack. `api` resolves on the compose network.
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-cache the fingerprinted assets; never cache index.html.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
