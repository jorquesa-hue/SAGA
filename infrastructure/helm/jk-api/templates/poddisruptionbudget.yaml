{{- if .Values.podDisruptionBudget.enabled -}}
# Pod disruption budget for critical workloads (JK-PLT-EES-001 §76).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "jk-api.fullname" . }}
  labels:
    {{- include "jk-api.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "jk-api.selectorLabels" . | nindent 6 }}
{{- end }}
