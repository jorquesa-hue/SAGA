# JK Platform REST API contract (JK-PLT-EES-001 Volume VI §45-§47, Appendix C).
#
# Source of truth for the REST surface. Phase 0 adds the identity surface
# (tenants, farms, users) on top of the Appendix C baseline (animals and
# device-observation ingestion, which are the Phase 1 contract baseline).
#
# Conventions (§46):
#   - base path /api/v1 (encoded in the server URL);
#   - camelCase JSON, snake_case only in the database;
#   - Idempotency-Key header required on every POST command;
#   - RFC 9457 Problem Details for all errors (code + correlationId);
#   - cursor pagination (limit + cursor) on growing collections;
#   - tenant context derives from the authenticated membership — it is never
#     a client-chosen request parameter.
openapi: 3.1.0
info:
  title: JK Platform API
  version: 1.0.0
  description: Command and integration API for JK Platform.
servers:
  - url: https://api.example.com/api/v1
security:
  - oidc: []
tags:
  - name: Tenants
    description: Tenant lifecycle (platform administration and tenant self-view).
  - name: Farms
    description: Farms inside the authenticated tenant.
  - name: Users
    description: Tenant memberships and invitations.
  - name: Animals
    description: Animal registry (Phase 1 contract baseline).
  - name: Devices
    description: Edge device ingestion (Phase 1 contract baseline).
  - name: AI
    description: >
      Governed AI recommendations (invariant #6, §190). Every recommendation
      carries evidence, confidence, and model/prompt provenance; high-impact
      actions require human approval and prohibited actions can never execute
      autonomously.
  - name: Webhooks
    description: >
      Tenant webhook subscriptions to allowlisted event families with signed,
      replay-protected delivery, bounded-backoff retries, dead-letter, and
      manual replay (§51).
  - name: Connectors
    description: Connector registrations behind stable domain interfaces (§33).
paths:
  /tenants:
    post:
      operationId: registerTenant
      summary: Register a tenant (platform administration)
      description: >
        Creates a tenant. Restricted to platform administrators
        (platform_admin is a platform-level role, outside tenant membership).
        Emits identity.tenant_created.v1.
      tags: [Tenants]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterTenantRequest" }
      responses:
        "201":
          description: Tenant registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /tenants/current:
    get:
      operationId: getCurrentTenant
      summary: Read the tenant of the authenticated membership
      tags: [Tenants]
      responses:
        "200":
          description: Tenant derived from the authenticated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/NotFound" }
  /farms:
    post:
      operationId: createFarm
      summary: Create a farm in the current tenant
      description: Emits identity.farm_created.v1. Farm names are unique per tenant.
      tags: [Farms]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFarmRequest" }
      responses:
        "201":
          description: Farm created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listFarms
      summary: List farms visible to the authenticated membership
      tags: [Farms]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated farm list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmList" }
  /users/invitations:
    post:
      operationId: inviteUser
      summary: Invite a user into the current tenant
      description: >
        Creates a pending membership with a canonical role and emits
        identity.user_invited.v1. Requires an inviting membership authorized
        to grant the requested role.
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /users:
    get:
      operationId: listUsers
      summary: List tenant memberships
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Cursor-paginated membership list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
  /animals:
    post:
      operationId: registerAnimal
      summary: Register an animal
      tags: [Animals]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterAnimalRequest" }
      responses:
        "201":
          description: Animal registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Animal" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listAnimals
      summary: List animals in the tenant (optionally by farm)
      tags: [Animals]
      parameters:
        - name: farmId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Animal list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Animal" }
  /animals/{animalId}:
    get:
      operationId: getAnimal
      tags: [Animals]
      parameters:
        - $ref: "#/components/parameters/AnimalId"
      responses:
        "200":
          description: Authorized animal summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Animal" }
        "404": { $ref: "#/components/responses/NotFound" }
  /device-observations:batch:
    post:
      operationId: ingestDeviceObservationBatch
      tags: [Devices]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObservationBatch" }
      responses:
        "207":
          description: Per-observation result; partial success allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservationBatchResult" }
  /animals/{animalId}/timeline:
    get:
      operationId: getAnimalTimeline
      summary: Cursor/limited chronological event timeline (JK-ANI-004)
      tags: [Animals]
      parameters:
        - $ref: "#/components/parameters/AnimalId"
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: types, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Timeline entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
  /animals/{animalId}/identifiers:
    post:
      operationId: assignOrReplaceIdentifier
      summary: Assign or replace an identifier (JK-ANI-002, JK-DOM-003)
      tags: [Animals]
      parameters:
        - $ref: "#/components/parameters/AnimalId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifierType, identifierValue]
              properties:
                identifierType: { type: string, enum: [rfid, visual, official, legacy] }
                identifierValue: { type: string }
                replace: { type: boolean, default: false }
                reason: { type: string }
      responses:
        "201": { description: Identifier assigned or replaced }
        "409": { $ref: "#/components/responses/Conflict" }
  /animals/{animalId}/weights:
    get:
      operationId: getAnimalWeights
      summary: Validated weight series (§11)
      tags: [Herd]
      parameters:
        - $ref: "#/components/parameters/AnimalId"
      responses:
        "200":
          description: Weight points
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
  /animals/{animalId}/adg:
    get:
      operationId: getAnimalAdg
      summary: Average daily gain from eligible readings (JK-WGT-006)
      tags: [Herd]
      parameters:
        - $ref: "#/components/parameters/AnimalId"
      responses:
        "200":
          description: ADG result (or null when insufficient data)
          content:
            application/json:
              schema: { type: object }
  /handling-sessions:
    post:
      operationId: startHandlingSession
      summary: Start a handling session (JK-WGT-001)
      tags: [Herd]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farmId]
              properties:
                farmId: { type: string, format: uuid }
                purpose: { type: string, enum: [weighing, vaccination, pregnancy_check, treatment, handling, other] }
                deviceId: { type: string }
                expectedCount: { type: integer, minimum: 0 }
      responses:
        "201": { description: Session started }
  /handling-sessions/{sessionId}/observations:
    post:
      operationId: recordObservation
      summary: Record one weight observation through the validation pipeline
      tags: [Herd]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceObservation" }
      responses:
        "201": { description: Accepted observation }
        "202": { description: Observation recorded as exception (pending/rejected) }
  /handling-sessions/{sessionId}/close:
    post:
      operationId: closeHandlingSession
      summary: Close and summarize a handling session
      tags: [Herd]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Session closed with counts summary }
  /handling-sessions/{sessionId}/exceptions:
    get:
      operationId: listSessionExceptions
      summary: Unresolved/rejected observations for a session (JK-WGT-003)
      tags: [Herd]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Exception queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
  /recommendations:
    post:
      operationId: createRecommendation
      summary: Record an AI recommendation with evidence (invariant #6, §190)
      description: >
        Agents/services record a recommendation. Evidence event ids,
        confidence, and model/prompt provenance are mandatory. A proposal for a
        prohibited action category is accepted (as a proposal) but can never be
        executed autonomously. Returns 409 (JK-AI-DISABLED) when the tenant AI
        kill switch is off.
      tags: [AI]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRecommendationRequest" }
      responses:
        "201":
          description: Recommendation recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listRecommendations
      summary: List recommendations for the current tenant
      tags: [AI]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, expired, executed]
      responses:
        "200":
          description: Recommendation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Recommendation" }
  /recommendations/{recommendationId}:
    get:
      operationId: getRecommendation
      summary: Read one recommendation
      tags: [AI]
      parameters:
        - $ref: "#/components/parameters/RecommendationId"
      responses:
        "200":
          description: Recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendation" }
        "404": { $ref: "#/components/responses/NotFound" }
  /recommendations/{recommendationId}/approve:
    post:
      operationId: approveRecommendation
      summary: Human approval of a recommendation (JK-AI-APPROVAL)
      description: >
        Only a human management role may approve. An agent may not approve its
        own proposal (human-in-the-loop).
      tags: [AI]
      parameters:
        - $ref: "#/components/parameters/RecommendationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Approved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /recommendations/{recommendationId}/reject:
    post:
      operationId: rejectRecommendation
      summary: Reject a recommendation
      tags: [AI]
      parameters:
        - $ref: "#/components/parameters/RecommendationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "204": { description: Rejected }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /recommendations/{recommendationId}/execute:
    post:
      operationId: executeRecommendation
      summary: Attempt autonomous execution (governed)
      description: >
        Blocked with 403 (JK-AI-PROHIBITED) for prohibited action categories and
        409 (JK-AI-APPROVAL-REQUIRED) when no human approval exists. Both
        attempts are audited to the append-only ai_action_audit ledger.
      tags: [AI]
      parameters:
        - $ref: "#/components/parameters/RecommendationId"
      responses:
        "200":
          description: Executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  executed: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }
  /webhooks/subscriptions:
    post:
      operationId: createWebhookSubscription
      summary: Subscribe to allowlisted event families (§51)
      description: >
        Creates a webhook subscription. Only allowlisted event families are
        accepted (422 otherwise). The signing secret is returned ONCE in the
        response and never again.
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookSubscriptionRequest" }
      responses:
        "201":
          description: Subscription created; secret returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSubscriptionWithSecret" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      tags: [Webhooks]
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookSubscription" }
  /webhooks/subscriptions/{subscriptionId}:
    get:
      operationId: getWebhookSubscription
      summary: Read a webhook subscription
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSubscription" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deactivateWebhookSubscription
      summary: Deactivate a webhook subscription
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Deactivated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /webhooks/subscriptions/{subscriptionId}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret with an overlap window (§51)
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: New secret (previous stays valid until the next rotation)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSubscriptionWithSecret" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /webhooks/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List webhook delivery attempts (delivery log, §51)
      tags: [Webhooks]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, delivering, delivered, failed, dead_letter]
        - name: subscriptionId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
  /webhooks/deliveries/{deliveryId}/replay:
    post:
      operationId: replayWebhookDelivery
      summary: Manually replay a failed/dead-letter delivery (§51)
      tags: [Webhooks]
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Delivery reset to pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /connectors:
    post:
      operationId: registerConnector
      summary: Register a connector behind a stable domain interface (§33)
      tags: [Connectors]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterConnectorRequest" }
      responses:
        "201":
          description: Connector registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorRegistration" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listConnectors
      summary: List connector registrations
      tags: [Connectors]
      responses:
        "200":
          description: Connectors
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectorRegistration" }
  /connectors/{connectorId}:
    get:
      operationId: getConnector
      summary: Read a connector registration
      tags: [Connectors]
      parameters:
        - name: connectorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Connector
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorRegistration" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.com/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated idempotency key (§46). Retried commands with the same
        key return the original result instead of duplicating the effect.
      schema: { type: string, minLength: 16, maxLength: 200 }
    AnimalId:
      name: animalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items per page.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor token from a previous page (stable ordering, §46).
      schema: { type: string, maxLength: 512 }
  schemas:
    Role:
      type: string
      description: Canonical tenant-membership roles. platform_admin is platform-level and never a tenant membership role.
      enum:
        - tenant_owner
        - farm_manager
        - technician
        - veterinarian
        - genetics_specialist
        - finance_user
        - auditor
        - integration_service
    RegisterTenantRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        defaultLocale:
          type: string
          minLength: 2
          maxLength: 35
          default: pt-BR
          description: BCP 47 language tag.
        defaultCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          default: BRL
          description: ISO 4217 currency code.
    Tenant:
      type: object
      required: [id, name, defaultLocale, defaultCurrency, status, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        defaultLocale: { type: string }
        defaultCurrency: { type: string }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
    CreateFarmRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone:
          type: string
          maxLength: 64
          default: America/Sao_Paulo
          description: IANA time zone identifier.
        areaHa:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: Total farm area in hectares.
    Farm:
      type: object
      required: [id, tenantId, name, timezone, areaHa, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        areaHa: { type: [number, "null"] }
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
    FarmList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Farm" }
        nextCursor:
          type: [string, "null"]
          description: Cursor for the next page; null when exhausted.
    InviteUserRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
    Invitation:
      type: object
      required: [id, tenantId, email, displayName, role, status, invitedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [invited, active, revoked, expired] }
        invitedAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
    User:
      type: object
      required: [id, email, displayName, role, membershipStatus, invitedAt, activatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        membershipStatus: { type: string, enum: [invited, active, revoked] }
        invitedAt: { type: string, format: date-time }
        activatedAt: { type: [string, "null"], format: date-time }
    UserList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        nextCursor:
          type: [string, "null"]
          description: Cursor for the next page; null when exhausted.
    RegisterAnimalRequest:
      type: object
      additionalProperties: false
      required: [farmId, visualId, sex, breedCode]
      properties:
        farmId: { type: string, format: uuid }
        visualId: { type: string, minLength: 1, maxLength: 80 }
        rfid: { type: [string, "null"], maxLength: 128 }
        sex: { type: string, enum: [female, male, unknown] }
        breedCode: { type: string, default: BRANGUS }
        birthDate: { type: [string, "null"], format: date }
    Animal:
      type: object
      required: [id, farmId, visualId, sex, breedCode, lifecycleStatus, version]
      properties:
        id: { type: string, format: uuid }
        farmId: { type: string, format: uuid }
        visualId: { type: string }
        sex: { type: string }
        breedCode: { type: string }
        lifecycleStatus: { type: string }
        version: { type: integer, minimum: 0 }
    ObservationBatch:
      type: object
      required: [gatewayId, batchId, observations]
      properties:
        gatewayId: { type: string, format: uuid }
        batchId: { type: string }
        sequence: { type: integer, minimum: 0 }
        observations:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/DeviceObservation" }
    DeviceObservation:
      type: object
      required: [observationId, capturedAt, deviceId, measurementType, value, unit]
      properties:
        observationId: { type: string }
        capturedAt: { type: string, format: date-time }
        deviceId: { type: string }
        rfid: { type: [string, "null"] }
        measurementType: { type: string, enum: [weight] }
        value: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [kg, lb] }
        stable: { type: [boolean, "null"] }
        rawPayload: { type: [object, "null"] }
    ObservationBatchResult:
      type: object
      required: [batchId, results]
      properties:
        batchId: { type: string }
        results:
          type: array
          items:
            type: object
            required: [observationId, status]
            properties:
              observationId: { type: string }
              serverObservationId: { type: [string, "null"] }
              status:
                type: string
                enum:
                  [
                    accepted,
                    duplicate,
                    pending_resolution,
                    rejected_validation,
                    retryable_error,
                  ]
              problem: { $ref: "#/components/schemas/Problem" }
    Problem:
      type: object
      description: RFC 9457 Problem Details with JK extensions (§46.1).
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        correlationId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, reason]
            properties:
              field: { type: string }
              reason: { type: string }
    CreateRecommendationRequest:
      type: object
      required:
        - agentName
        - modelProvider
        - modelVersion
        - promptVersion
        - recommendationText
        - proposedActionCategory
        - evidenceEventIds
        - confidence
        - riskClass
      properties:
        agentName: { type: string, minLength: 1 }
        modelProvider: { type: string, minLength: 1 }
        modelVersion: { type: string, minLength: 1 }
        promptVersion: { type: string, minLength: 1 }
        recommendationText: { type: string, minLength: 1 }
        proposedActionCategory:
          type: string
          description: Action category; prohibited categories can never execute autonomously.
        proposedAction:
          type: object
          additionalProperties: true
          description: Structured proposed action payload (optional).
        evidenceEventIds:
          type: array
          minItems: 1
          description: At least one supporting domain event id (invariant #6, §190).
          items: { type: string }
        confidence:
          type: number
          minimum: 0
          maximum: 1
        assumptions:
          type: array
          items: { type: string }
        riskClass:
          type: string
          enum: [low, medium, high]
    Recommendation:
      type: object
      required:
        - id
        - status
        - proposedActionCategory
        - evidenceEventIds
        - confidence
        - prohibited
      properties:
        id: { type: string, format: uuid }
        agentName: { type: string }
        modelProvider: { type: string }
        modelVersion: { type: string }
        promptVersion: { type: string }
        recommendationText: { type: string }
        proposedActionCategory: { type: string }
        evidenceEventIds:
          type: array
          items: { type: string }
        confidence: { type: number }
        riskClass:
          type: string
          enum: [low, medium, high]
        prohibited:
          type: boolean
          description: True when the proposed category can never execute autonomously.
        highImpact:
          type: boolean
          description: True when execution requires human approval.
        status:
          type: string
          enum: [pending, approved, rejected, expired, executed]
        approvedBy: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    CreateWebhookSubscriptionRequest:
      type: object
      required: [url, eventFamilies]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS endpoint that receives signed deliveries.
        eventFamilies:
          type: array
          minItems: 1
          description: Allowlisted event families (§51).
          items:
            type: string
            enum: [animal, weight, health, reproduction, herd, inventory, finance, genetics, pasture, asset]
        description: { type: string }
    WebhookSubscription:
      type: object
      required: [id, url, eventFamilies, active]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        eventFamilies:
          type: array
          items: { type: string }
        description: { type: string, nullable: true }
        active: { type: boolean }
    WebhookSubscriptionWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookSubscription"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Signing secret — returned only at creation and rotation.
    WebhookDelivery:
      type: object
      required: [id, subscriptionId, deliveryId, eventId, eventType, eventFamily, status, attempts, maxAttempts]
      properties:
        id: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        deliveryId: { type: string, format: uuid }
        eventId: { type: string }
        eventType: { type: string }
        eventFamily: { type: string }
        status:
          type: string
          enum: [pending, delivering, delivered, failed, dead_letter]
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lastStatusCode: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }
    RegisterConnectorRequest:
      type: object
      required: [connectorType, name]
      properties:
        connectorType:
          type: string
          enum:
            - rfid_reader
            - electronic_scale
            - edge_gateway
            - csv_xlsx_import
            - laboratory_result
            - genetics_evaluation
            - identity_provider
            - messaging_provider
            - accounting_export
            - geospatial_provider
            - object_storage
            - webhook
        name: { type: string, minLength: 1 }
        config:
          type: object
          additionalProperties: true
          description: Non-secret configuration; credentials are referenced, never inlined.
    ConnectorRegistration:
      type: object
      required: [id, connectorType, name, status]
      properties:
        id: { type: string, format: uuid }
        connectorType: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [active, suspended, error]
  responses:
    Conflict:
      description: Business conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found or not visible
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not authorized for this action
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Request understood but semantically invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
